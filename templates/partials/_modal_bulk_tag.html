        <!-- Bulk Tag Edit Modal -->
        <div id="bulk-tag-modal" class="fixed inset-0 z-[110] hidden items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
            <div class="glass-panel p-6 rounded-xl shadow-[0_0_40px_rgba(0,0,0,0.8)] max-w-lg w-full border border-violet-500/30 overflow-y-auto max-h-[90vh]">
                <div class="flex justify-between items-center mb-5">
                    <h3 class="text-sm font-bold text-slate-200 uppercase tracking-widest flex items-center gap-2">
                        <svg class="w-5 h-5 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        Bulk Edit Tags
                    </h3>
                    <button onclick="closeBulkTagEdit()" type="button" class="text-slate-500 border border-slate-700 rounded hover:text-white hover:bg-rose-500 hover:border-rose-500 transition-colors p-1" title="Close">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <div id="bulk-tag-selected-info" class="mb-4 p-3 bg-slate-800/50 rounded-lg border border-slate-700">
                    <p class="text-xs text-slate-300 font-mono"><span id="bulk-tag-count">0</span> devices selected</p>
                    <input type="hidden" id="bulk-tag-mac-array">
                </div>

                <div class="mb-4">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Action</label>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                            <input type="radio" name="bulk-tag-action" value="add" class="rounded bg-slate-800 border-slate-700 text-violet-500 focus:ring-violet-500" checked>
                            Add Tag
                        </label>
                        <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer">
                            <input type="radio" name="bulk-tag-action" value="remove" class="rounded bg-slate-800 border-slate-700 text-violet-500 focus:ring-violet-500">
                            Remove Tag
                        </label>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Category Filter</label>
                    <select id="bulk-tag-category" class="w-full bg-slate-800 border border-slate-700 rounded py-2 px-3 text-xs text-slate-200 focus:ring-1 focus:ring-violet-500 outline-none mb-3">
                        <option value="">All Categories</option>
                        {% for cat in tag_categories|default(["hardware", "firmware_compat", "firmware_feature", "firmware_build", "role", "custom"]) %}
                        <option value="{{ cat }}">{{ cat|replace('_', ' ')|title }}</option>
                        {% endfor %}
                    </select>
                    
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Select Tag to Edit</label>
                    <select id="bulk-tag-select" class="w-full bg-slate-800 border border-slate-700 rounded py-2 px-3 text-xs text-slate-200 focus:ring-1 focus:ring-violet-500 outline-none" size="6">
                        <!-- Populated by JS -->
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Or type comma-separated tags</label>
                    <input type="text" id="bulk-tag-text-input" placeholder="tag1, tag2, tag3" class="w-full bg-slate-800 border border-slate-700 rounded py-2 px-3 text-xs text-slate-200 placeholder-slate-500 focus:ring-1 focus:ring-violet-500 outline-none">
                    <p class="text-[10px] text-slate-500 mt-1">Tags will be matched to existing tags by name. New tags are created automatically.</p>
                </div>

                <div id="bulk-tag-msg" class="text-xs font-mono hidden"></div>

                <div class="flex justify-end gap-3 mt-6">
                    <button onclick="closeBulkTagEdit()" class="px-4 py-2 text-xs font-bold tracking-wider uppercase rounded bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700 hover:text-white transition-all">Cancel</button>
                    <button onclick="applyBulkTagEdit()" class="px-4 py-2 text-xs font-bold tracking-wider uppercase rounded bg-violet-600 text-white hover:bg-violet-500 transition-all">Apply to Selected</button>
                </div>
            </div>
        </div>
